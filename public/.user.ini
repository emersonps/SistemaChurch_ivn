; Faz o OPcache checar o mtime dos arquivos a cada requisicao, em vez de
; confiar em cache ate um reset manual. Sem isso, um deploy pode subir
; codigo novo via SFTP mas os workers do PHP-FPM continuam servindo bytecode
; antigo indefinidamente — opcache_reset() (chamado pelo deploy) so limpa o
; cache do worker que atendeu aquela requisicao especifica, nao o pool
; inteiro, entao os demais workers ficam com codigo velho ate serem
; reciclados. revalidate_freq=0 elimina esse problema sem precisar reiniciar
; o PHP-FPM a cada deploy.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
